<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it every env(safe-area-inset-*) the phone
         shell pads with is 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Charlie Pelle | Fullstack Developer Portfolio</title>
    <meta name="description" content="Portfolio of Charlie Pelle, a Fullstack Developer specializing in PHP, Laravel, Node.js, MySQL, and ASP.NET. Check out my projects and systems." />
    <meta name="author" content="Charlie Pelle" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#F4F4ED" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="preload" as="image" href="/images/profile/pic2.jpg" fetchpriority="high" media="(min-width: 1100px)" />

    <!-- Open Graph / social share -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Charlie Pelle Portfolio" />
    <meta property="og:title" content="Charlie Pelle | Fullstack Developer Portfolio" />
    <meta property="og:description" content="Professional Fullstack Developer specializing in PHP, Laravel, MySQL, and ASP.NET." />
    <meta property="og:image" content="/images/projects/thynk-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Theme before first paint -->
    <script>
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
        if (document.documentElement.dataset.theme === 'dark') {
          var bar = document.querySelector('meta[name="theme-color"]');
          if (bar) bar.setAttribute('content', '#070B14');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
